<style>
/* Layout: app de operação mobile-first; cabeçalho fixo, conteúdo em coluna de até 980px, navegação inferior (topo no desktop). Tema único escuro, deliberado: preto e ouro da marca FAV. */
:root {
  color-scheme: dark;
  --bg: #0A0A0B;
  --s1: #111113;
  --s2: #18181B;
  --line: #2A2620;
  --line2: #3A342A;
  --gold: #D6AE52;
  --gold-hi: #E6C877;
  --gold-lo: #A97F2A;
  --ink: #F2EDE3;
  --mute: #A39C8E;
  --mute2: #7A7366;
  --ok: #74C28F;
  --ok-bg: rgba(116,194,143,.12);
  --bad: #E5736A;
  --bad-bg: rgba(229,115,106,.12);
  --gold-bg: rgba(214,174,82,.12);
  --disp: Archivo, 'Arial Black', Arial, sans-serif;
  --body: Archivo, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-stretch: 100%; font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
.disp { font-family: var(--disp); font-stretch: 125%; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
.mono { font-family: var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums; }
.gold { color: var(--gold); }
.goldtext { background: linear-gradient(180deg, #F3DD95, #D6AE52 55%, #A97F2A); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mute { color: var(--mute); }
.small { font-size: 13px; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(10,10,11,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
.brand svg { flex: none; }
.brand .bt { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.brand .bt b { font-family: var(--disp); font-stretch: 125%; font-weight: 700; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .bt span { font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; color: var(--mute); text-transform: uppercase; }

main { max-width: 980px; margin: 0 auto; padding-top: 18px; padding-bottom: calc(100px + var(--safe-b)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* nav */

.nav-in { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; color: var(--mute2); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 9px; font-size: 11px; font-weight: 600; cursor: pointer; min-height: 56px; }

@media (min-width: 900px) {
  .nav { top: calc(env(safe-area-inset-top, 0px) + 60px); bottom: auto; position: sticky; border-top: 0; border-bottom: 1px solid var(--line); }

}

/* blocks */
.h1 { font-family: var(--disp); font-stretch: 125%; font-weight: 700; text-transform: uppercase; font-size: 22px; line-height: 1.1; margin: 0; text-wrap: balance; }

.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.panel { background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.panel.flush { padding: 4px 16px; }
.sechead { display: flex; align-items: center; gap: 10px; justify-content: space-between; }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }

.kpi { background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.kpi .v { font-family: var(--disp); font-stretch: 112%; font-weight: 700; font-size: 26px; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.kpi.gold { border-color: var(--line2); background: linear-gradient(180deg, #17140C, var(--s1)); }
.kpi.gold .v { color: var(--gold-hi); font-size: 22px; }

.btn { appearance: none; border: 1px solid var(--line2); background: transparent; color: var(--ink); border-radius: 6px; padding: 10px 16px; min-height: 44px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: #5A4C2E; }
.btn.gold { background: linear-gradient(180deg, #EBCB76, #C9A14A); color: #0A0A0B; border-color: transparent; }
.btn.gold:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); border-color: #5A2A26; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 17px; height: 17px; flex: none; }
.icon { background: none; border: 0; width: 40px; height: 40px; border-radius: 8px; color: var(--mute); display: grid; place-items: center; cursor: pointer; flex: none; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--s1); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }

.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; white-space: nowrap; border: 1px solid var(--line2); color: var(--mute); }
.tag.gold { background: var(--gold); color: #0A0A0B; border-color: var(--gold); }
.tag.goldline { color: var(--gold-hi); border-color: #5A4C2E; background: var(--gold-bg); }
.tag.ok { color: var(--ok); border-color: #2C5039; background: var(--ok-bg); }

.tag.m { color: #9FB6E0; border-color: #2E3B55; }

.av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--gold-hi); background: var(--s2); border: 1px solid var(--line2); overflow: hidden; }

.list { display: flex; flex-direction: column; }

.item .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.item .val { font-family: var(--disp); font-stretch: 112%; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* house cards */

.house { background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; text-align: left; color: inherit; width: 100%; }

/* date nav */

.datenav .dl span { font-size: 12.5px; color: var(--mute); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.cal .dw { text-align: center; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--mute2); text-transform: uppercase; padding: 4px 0; }
.cal button { aspect-ratio: 1 / 1; max-width: 100%; border: 1px solid transparent; background: var(--s1); border-radius: 8px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; padding: 0; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }

/* forms */
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mute); font-weight: 500; }
.inp { width: 100%; min-height: 46px; background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 10px 12px; font-size: 16px; color: var(--ink); outline: none; min-width: 0; }

/* sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: #0F0F11; border: 1px solid var(--line2); border-bottom: 0; width: 100%; max-width: 600px; max-height: 92vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; animation: up .18s ease-out; }

#toast { position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translateX(-50%) translateY(16px); opacity: 0; pointer-events: none; z-index: 90; background: var(--ink); color: #0A0A0B; font-weight: 600; font-size: 14px; padding: 11px 16px; border-radius: 8px; transition: .2s; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
#toast.show { opacity: 1; transform: translateX(-50%); }

.photo-drop { border: 1px dashed var(--line2); border-radius: 10px; min-height: 180px; display: grid; place-items: center; text-align: center; color: var(--mute); cursor: pointer; overflow: hidden; background: var(--bg); position: relative; }
.photo-drop img { width: 100%; max-height: 300px; object-fit: cover; display: block; }

pre.wa { white-space: pre-wrap; background: #0B1410; border: 1px solid #1E3A2C; color: #DCEFE3; border-radius: 10px; padding: 14px; font-family: var(--body); font-size: 14px; margin: 0; }

.empty { text-align: center; padding: 32px 16px; color: var(--mute); }

/* auth */
.auth { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: radial-gradient(700px 420px at 50% 0%, rgba(201,161,74,.16), rgba(10,10,11,0) 70%), var(--bg); }

.auth .card { width: 100%; max-width: 380px; background: var(--s1); border: 1px solid var(--line2); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }

.steps { display: flex; flex-direction: column; gap: 0; }

#prev { background: #15120A; border-bottom: 1px solid var(--line2); font-size: 12.5px; color: var(--mute); padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }

/* novidades: ao vivo, ocorrências, avaliação */
.tag.warn { color: #F0C674; border-color: #5A4A22; background: rgba(240,198,116,.10); }
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229,115,106,.55); } 70% { box-shadow: 0 0 0 8px rgba(229,115,106,0); } 100% { box-shadow: 0 0 0 0 rgba(229,115,106,0); } }
.panel.live { border-color: var(--line2); }
.mini3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }

.ochora { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--gold-hi); border: 1px solid #4A3F28; background: var(--gold-bg); border-radius: 6px; padding: 4px 7px; flex: none; margin-top: 2px; }
.stars { display: flex; gap: 6px; }
.stars button { background: var(--bg); border: 1px solid var(--line2); color: var(--mute2); width: 46px; height: 46px; border-radius: 8px; font-size: 22px; line-height: 1; cursor: pointer; }

textarea.wa-edit { min-height: 260px; background: #0B1410; border-color: #1E3A2C; color: #DCEFE3; font-size: 14px; line-height: 1.45; }
.photo-drop .spin { display: inline-block; }
.tap { cursor: pointer; }

/* ===== refinamento: semana, turnos, conferência, sede, olho ===== */
.brand .bt span .on-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin: 0 4px 1px 0; vertical-align: middle; }
.who .eyebtn { width: 44px; height: 44px; color: var(--mute2); }

.datebox { display: flex; flex-direction: column; gap: 10px; padding: 8px 8px 10px; }
.dlbtn { background: none; border: 0; color: inherit; cursor: pointer; padding: 4px 6px; border-radius: 8px; font: inherit; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }

.mini4 span { font-size: 11px; color: var(--mute); line-height: 1.25; }

@media (max-width: 380px) { .mini4 b { font-size: 20px; } }
.eyebrow.mt { display: block; margin-top: 16px; }

<script>
/* Servidor do app. Na versão de teste guarda tudo neste aparelho; com o Supabase configurado,
   as mesmas regras rodam aqui e cada alteração vai para o banco online, que confere o nível de acesso. */
(function () {
  const ONLINE = !!(FAV_SUPABASE_URL && FAV_SUPABASE_KEY);
  window.FAV_ONLINE = ONLINE;
  const KEY = 'fav-operacao-teste-v1';
  const PAPEIS = ['criador', 'diretoria', 'gerencia', 'rh_financeiro', 'supervisor', 'resp_turno'];
  const vazio = () => ({ seq: 0, sessao: null, cfg: { supValores: false }, usuarios: [], categorias: [], casas: [], colaboradores: [], eventos: [], turnos: [], escalas: [], fotos: {}, ocorrencias: [] });
  let D = vazio();

  class E extends Error { constructor(s, m) { super(m); this.status = s; } }
  const fail = (s, m) => { throw new E(s, m); };
  let ultimoId = 0;
  const nid = () => {
    if (!ONLINE) return ++D.seq;
    let v = Date.now() * 1000 + Math.floor(Math.random() * 1000);
    if (v <= ultimoId) v = ultimoId + 1;
    ultimoId = v; return v;
  };
  const txt = (v, max = 300) => String(v ?? '').trim().slice(0, max);
  const num = (v) => { let s = String(v ?? '').trim().replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : 0; };
  const int = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; };
  const dateOr = (v) => (/^\d{4}-\d{2}-\d{2}$/.test(String(v || '')) ? v : null);
  const hora = (v) => (/^\d{2}:\d{2}$/.test(String(v || '')) ? v : null);
  const emailOk = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  const digits = (s) => String(s || '').replace(/\D/g, '');
  const imgOk = (v) => (typeof v === 'string' && /^data:image\//.test(v) ? v : null);
  const toMin = (h) => { const [a, b] = String(h || '0:0').split(':').map(Number); return a * 60 + b; };
  const dur = (a, b) => { if (!a || !b) return 0; let m = toMin(b) - toMin(a); if (m < 0) m += 1440; return m; };
  const addMin = (h, m) => { const t = (((toMin(h) + m) % 1440) + 1440) % 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
  const pub = (u) => (u ? { id: u.id, nome: u.nome, email: u.email, papel: u.papel } : null);
  const PRIV = ['cpf', 'pix1_tipo', 'pix1', 'pix2_tipo', 'pix2'];

  /* ---------- quem pode o quê (o banco online confere tudo de novo) ---------- */
  const tem = (u, l) => !!u && l.includes(u.papel);
  const G3 = ['criador', 'diretoria', 'gerencia'];
  const geral = (u) => tem(u, G3);
  const isCfg = (u) => tem(u, ['criador', 'diretoria']);
  const isFin = (u) => tem(u, ['criador', 'diretoria', 'rh_financeiro']);
  const need = (ok, m) => { if (!ok) fail(403, m || 'Seu nível de acesso não permite isso.'); };
  const turnosDe = (id) => D.turnos.filter((t) => t.evento_id === id).sort((a, b) => a.ordem - b.ordem || a.id - b.id);
  const opera = (u, e) => geral(u) || e.supervisor_id === u.id || (e.supervisores || []).includes(u.id);
  const respEv = (u, e) => turnosDe(e.id).some((t) => t.responsavel_id === u.id);
  const ve = (u, e) => geral(u) || u.papel === 'rh_financeiro' || opera(u, e) || respEv(u, e);
  const canEv = (u, e) => { if (!opera(u, e)) fail(403, 'Esta operação é de outro supervisor.'); };
  const valOk = (u) => isFin(u) || (D.cfg.supValores && tem(u, ['supervisor', ...G3]));
  const uById = (id) => D.usuarios.find((u) => u.id === id);
  const evById = (id) => { const e = D.eventos.find((x) => x.id === id); if (!e) fail(404, 'Operação não encontrada.'); return e; };
  const aberto = (e) => { if (e.encerrado) fail(400, 'Operação encerrada. Reabra para alterar.'); };
  const casaNome = (id) => (D.casas.find((c) => c.id === id) || {}).nome || '';
  const loadEsc = (u, id, allowClosed, soOpera) => {
    const s = D.escalas.find((x) => x.id === id); if (!s) fail(404, 'Registro não encontrado.');
    const e = evById(s.evento_id);
    if (!opera(u, e)) {
      if (soOpera) fail(403, 'Esta operação é de outro supervisor.');
      const t = D.turnos.find((x) => x.id === s.turno_id);
      if (!t || t.responsavel_id !== u.id) fail(403, 'Você não é responsável por este turno.');
    }
    if (!allowClosed) aberto(e);
    return { s, e };
  };
  const prev = (p) => { const o = {}; Object.keys(p || {}).map(int).filter(Boolean).sort((a, b) => a - b).forEach((k) => { const n = int(p[k]); if (n > 0) o[String(k)] = Math.min(n, 999); }); return o; };

  /* ---------- fotos: 'pre:ID' presença (24h) · 'oc:ID' ocorrência · 'pf:ID' perfil ---------- */
  const FOTO_OPS = [];
  const fotoSet = (k, url) => { if (ONLINE) FOTO_OPS.push(['set', k, url]); else D.fotos[k] = url; };
  const fotoDel = (k) => { if (ONLINE) FOTO_OPS.push(['del', k]); else delete D.fotos[k]; };
  function limparFotos(u) {
    const lim = Date.now() - 24 * 3600e3; let n = 0;
    D.escalas.forEach((s) => {
      if (!s.tem_foto || !s.foto_em || new Date(s.foto_em).getTime() > lim) return;

      fotoDel('pre:' + s.id); s.tem_foto = false; n++;

  }

  const salvar = () => { if (ONLINE) return; try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { setTimeout(() => window.toast && toast('O espaço deste aparelho acabou e a última alteração não foi guardada. Apague fotos antigas ou use a versão online.', true), 0); } };

  function migrar() {
    const v = vazio(); Object.keys(v).forEach((k) => { if (D[k] === undefined) D[k] = v[k]; });

  const SEM_PERM = 'Seu nível de acesso não permite essa alteração.';

  const BUCKET = { pre: 'presencas', oc: 'ocorrencias', pf: 'perfis' };

  async function exec(action, b) {

/* ================= resumo da operação ================= */
function evResumo(e) {
  const es = escOf(e.id), ts = turnosOf(e.id);
  const r = { total: es.length, m: 0, f: 0, pres: 0, conc: 0, falt: 0, prev: 0, late: 0, oc: 0, turnos: ts.length,
    previsto: ts.reduce((a, t) => a + prevTot(t), 0), faltam: ts.reduce((a, t) => a + faltamTurno(t), 0) };
  es.forEach((s) => {
    colab(s.colab_id).sexo === 'F' ? r.f++ : r.m++;
    if (s.status === 'presente') r.pres++;
    if (s.status === 'concluido') r.conc++;
    if (s.status === 'faltou') r.falt++;
    if (s.status !== 'faltou') r.prev += valS(s);
    if (atrasoAgora(s, e)) r.late++;
  });
  r.oc = ocOf(e.id).length;
  r.ativos = r.pres + r.conc;
  r.esc = r.total - r.falt;
  r.estado = e.encerrado ? 'Encerrada' : r.total && r.conc && !r.pres && r.conc + r.falt === r.total ? 'Concluída' : r.ativos ? 'Em andamento' : 'Planejada';
  return r;
}
const estadoTag = (st) => (st === 'Em andamento' ? `<span class="tag gold">${st}</span>` : st === 'Planejada' ? `<span class="tag">${st}</span>` : `<span class="tag ok">${st}</span>`);
const stTag = (s) => ({ escalado: '<span class="tag">Escalado</span>', presente: '<span class="tag gold">Presente</span>', concluido: '<span class="tag ok">Concluído</span>', faltou: '<span class="tag bad">Faltou</span>' }[s.status]);
const prevTag = (r) => (r.previsto ? `<span class="tag ${r.faltam ? 'bad' : 'ok'}">${r.faltam ? `faltam ${r.faltam} do previsto` : 'efetivo completo'}</span>` : '');

function houseCard(e, from) {
  const r = evResumo(e), c = casa(e.casa_id);
  const pc = r.total ? (r.ativos / r.total) * 100 : 0, pf = r.total ? (r.falt / r.total) * 100 : 0;
  return `<div class="house" data-act="openev" data-id="${e.id}" data-from="${from}" role="button" tabindex="0" aria-label="${esc(c.nome)}, ${r.ativos} de ${r.total} presentes">
    <div class="hd"><div class="tt"><b>${esc(c.nome)}</b><span>${e.nome ? esc(e.nome) + ' · ' : ''}${e.inicio}–${e.fim} · Sup. ${esc(user(e.supervisor_id).nome)}${(e.supervisores || []).length ? ` +${e.supervisores.length}` : ''}</span></div>${estadoTag(r.estado)}</div>
    <div class="row" style="gap:14px"><div class="grow"><div class="bar"><i style="width:${pc}%;background:var(--gold)"></i><i style="width:${pf}%;background:var(--bad)"></i></div></div>
      <span class="num small"><b style="color:var(--ink)">${r.ativos}</b><span class="mute">/${r.total} presentes</span></span></div>
    <div class="row wrap" style="gap:6px"><span class="tag goldline">${ic('clock', 12)}${r.turnos} turno${r.turnos > 1 ? 's' : ''}</span>${r.previsto ? `<span class="tag">${r.esc}/${r.previsto} previsto</span>` : ''}${prevTag(r)}</div>

  </div>`;

function painelAoVivo(evs, isT) {
  const ontem = addD(hoje(), -1);
  const late = [];
  if (isT) DB.eventos.filter((e) => (e.data === hoje() || e.data === ontem) && !e.encerrado).forEach((e) => escOf(e.id).forEach((s) => { const m = atrasoAgora(s, e); if (m) late.push({ s, e, m }); }));
  late.sort((a, b) => b.m - a.m);
  const todas = evs.flatMap((e) => escOf(e.id));
  const emServ = todas.filter((s) => s.status === 'presente').length;
  const falt = todas.filter((s) => s.status === 'faltou').length;
  const ocs = evs.reduce((a, e) => a + ocOf(e.id).length, 0);
  const linhas = []; evs.forEach((e) => turnosOf(e.id).forEach((t) => linhas.push({ e, t })));
  const pend = [];
  linhas.forEach(({ e, t }) => {
    if (!t.responsavel_id) pend.push({ e, t, txt: `${casa(e.casa_id).nome} · ${t.nome}: sem responsável de turno` });
    cobertura(t).forEach((r) => { if (r.prev > r.esc) pend.push({ e, t, bad: true, txt: `${casa(e.casa_id).nome} · ${t.nome}: faltam ${r.prev - r.esc} ${catg(r.k).nome}` }); });
  });
  evs.forEach((e) => { const vistos = new Set(); escOf(e.id).forEach((s) => { const c = colab(s.colab_id); if (vistos.has(c.id) || s.status === 'faltou' || !catg(s.cat_id).exige_curso || !cursoVencido(c, e.data)) return; vistos.add(c.id); pend.push({ e, bad: true, txt: `${c.nome}: curso vencido, escalado em ${casa(e.casa_id).nome}` }); }); });
  const semFoto = todas.filter((s) => (s.status === 'presente' || s.status === 'concluido') && !s.tem_foto && !s.foto_em).length;
  if (semFoto) pend.push({ e: evs.find((e) => escOf(e.id).some((s) => (s.status === 'presente' || s.status === 'concluido') && !s.tem_foto && !s.foto_em)), tab: 'presenca', txt: `${semFoto} presença${semFoto > 1 ? 's' : ''} confirmada${semFoto > 1 ? 's' : ''} sem foto` });
  if (!evs.length && !late.length) return '';
  return `<div class="panel live">
    <div class="row" style="margin-bottom:10px"><span class="dot-live" aria-hidden="true"></span><span class="eyebrow grow">${isT ? 'Conferência ao vivo' : 'Conferência da data'}${S.online ? ' · sincronizado' : ''}</span><span class="small mute num">${agora()}</span></div>
    <div class="mini4">
      <div><b class="num">${emServ}</b><span>em serviço</span></div>
      <div class="${late.length ? 'bad' : ''}"><b class="num">${late.length}</b><span>atrasado${late.length === 1 ? '' : 's'}</span></div>
      <div class="${falt ? 'bad' : ''}"><b class="num">${falt}</b><span>falta${falt === 1 ? '' : 's'}</span></div>
      <div><b class="num">${ocs}</b><span>ocorrência${ocs === 1 ? '' : 's'}</span></div>
    </div>
    ${linhas.length ? `<span class="eyebrow mt" style="color:var(--mute)">Cobertura por turno</span><div class="list">${linhas.map(({ e, t }) => {
      const es = escTurno(t.id), ativos = es.filter((s) => s.status === 'presente' || s.status === 'concluido').length, tot = es.filter((s) => s.status !== 'faltou').length, pv = prevTot(t), base = Math.max(pv, tot) || 1;
      return `<div class="item tap" data-act="openev" data-id="${e.id}" data-from="hoje" data-turno="${t.id}" data-tab="presenca" role="button" tabindex="0">
        <div class="tx"><span class="n">${esc(casa(e.casa_id).nome)} · ${esc(t.nome)}</span><span class="s"><span>${t.inicio}–${t.fim}</span><span>Resp. ${t.responsavel_id ? esc(user(t.responsavel_id).nome) : '<b style="color:var(--bad)">sem responsável</b>'}</span>${covChips(t)}</span>
        <div class="bar" style="margin-top:6px"><i style="width:${(ativos / base) * 100}%;background:var(--gold)"></i><i style="width:${(Math.max(0, tot - ativos) / base) * 100}%;background:var(--line2)"></i></div></div>
        <span class="num small" style="text-align:right"><b style="color:var(--ink);font-size:15px">${ativos}</b><span class="mute">/${pv || tot}</span><br><span class="mute" style="font-size:11px">presentes</span></span></div>`;
    }).join('')}</div>` : ''}
    ${pend.length ? `<span class="eyebrow mt" style="color:var(--mute)">Pendências para conferir</span><div class="list">${pend.slice(0, 10).map((p) => `<div class="item tap" data-act="openev" data-id="${p.e.id}" data-from="hoje"${p.t ? ` data-turno="${p.t.id}"` : ''}${p.tab ? ` data-tab="${p.tab}"` : ''} role="button" tabindex="0"><span style="color:${p.bad ? 'var(--bad)' : 'var(--gold)'};flex:none">${ic('alert', 18)}</span><div class="tx"><span class="n" style="white-space:normal;font-weight:500">${esc(p.txt)}</span></div>${ic('next', 16, 'color:var(--mute);flex:none')}</div>`).join('')}${pend.length > 10 ? `<div class="small mute" style="padding-top:8px">… e mais ${pend.length - 10}.</div>` : ''}</div>` : ''}
    ${late.length ? `<span class="eyebrow mt" style="color:var(--bad)">Atrasados agora</span><div class="list">${late.slice(0, 8).map((x) => `<div class="item tap" data-act="openev" data-id="${x.e.id}" data-from="hoje" data-tab="presenca" data-turno="${x.s.turno_id}" role="button" tabindex="0">${av(colab(x.s.colab_id))}<div class="tx"><span class="n">${esc(colab(x.s.colab_id).nome)}</span><span class="s"><span>${esc(casa(x.e.casa_id).nome)}</span><span>previsto ${x.s.ent_prev}</span></span></div><span class="tag bad">+${fmtM(x.m)}</span></div>`).join('')}${late.length > 8 ? `<div class="small mute" style="padding-top:8px">… e mais ${late.length - 8}.</div>` : ''}</div>` : ''}
    ${!pend.length && !late.length && linhas.length ? '<div class="note" style="margin-top:12px">Tudo conferido: efetivo completo, responsáveis definidos e ninguém atrasado.</div>' : ''}
  </div>`;
}
function alertaCursos() {
  if (!isGeral() && !isFin()) return '';

  const venc = at.filter((c) => cursoVencido(c)).length, vence = at.filter((c) => cursoVence(c)).length;
  if (!venc && !vence) return '';
  return `<div class="panel row tap" data-act="cursos" data-v="${venc ? 'venc' : 'vence'}" role="button" tabindex="0" style="gap:12px;cursor:pointer"><span style="color:var(--gold);flex:none">${ic('alert', 22)}</span><div class="grow"><b>Cursos da equipe</b><div class="small mute">${[venc ? `${venc} vencido${venc > 1 ? 's' : ''}` : '', vence ? `${vence} vence${vence > 1 ? 'm' : ''} em até 30 dias` : ''].filter(Boolean).join(' · ')}</div></div>${ic('next', 18, 'color:var(--mute)')}</div>`;
}
function primeirosPassos() {
  if (!isCfg()) return '';
  const passos = [
    [DB.categorias.some((c) => c.ativo), 'Categorias e valores', 'Vigilante grandes eventos, vigilante, controlador…', 'config', 'categorias'],
    [DB.casas.some((c) => c.ativo), 'Casas e locais', 'Onde a FAV opera', 'config', 'casas'],
    [DB.usuarios.filter((u) => u.papel && u.ativo).length > 1, 'Acessos da equipe interna', 'Gerência, RH, supervisores e responsáveis de turno', 'config', 'usuarios'],
    [DB.colabs.some((c) => c.ativo), 'Banco de talentos', 'Quem confirmou no grupo, com foto e PIX', 'equipe', ''],
    [DB.eventos.length > 0, 'Primeira operação', 'Casa, data, turnos e efetivo previsto', 'novoev', ''],
  ];
  if (passos.every((p) => p[0])) return '';
  return `<div class="panel"><span class="eyebrow">Primeiros passos</span><div class="steps" style="margin-top:6px">${passos.map(([ok, t, s, v, p], i) => `

      <span class="ck">${ok ? ic('check', 14) : i + 1}</span><div class="tx"><span class="n">${t}</span><span class="s">${s}</span></div>${ok ? '' : ic('next', 18, 'color:var(--mute)')}</div>`).join('')}</div></div>`;

VIEWS.hoje = () => {
  const evs = visEventos().filter((e) => e.data === S.date).sort((a, b) => toMin(a.inicio) - toMin(b.inicio));
  const tot = evs.reduce((a, e) => { const r = evResumo(e); a.t += r.esc; a.p += r.ativos; a.v += r.prev; a.pv += r.previsto; a.f += r.falt; return a; }, { t: 0, p: 0, v: 0, pv: 0, f: 0 });
  const isT = S.date === hoje();
  return `${primeirosPassos()}
  ${semana()}
  <div class="kpis">
    <div class="kpi"><span class="l">${isGeral() || isFin() ? 'Operações na data' : 'Minhas operações'}</span><span class="v">${evs.length}</span></div>
    <div class="kpi"><span class="l">Escalados</span><span class="v">${tot.t}${tot.pv ? `<small>/${tot.pv}</small>` : ''}</span></div>
    <div class="kpi"><span class="l">Presentes</span><span class="v">${tot.p}<small>/${tot.t}</small></span></div>
    ${verValor() ? `<div class="kpi gold"><span class="l">Valor da data</span><span class="v">${brl(tot.v)}</span></div>` : `<div class="kpi"><span class="l">Faltas</span><span class="v">${tot.f}</span></div>`}
  </div>
  ${evs.length || isT ? painelAoVivo(evs, isT) : ''}
  ${alertaCursos()}
  <div class="sechead"><span class="h2">Operações</span><div class="row" style="gap:8px">${evs.length ? `<button class="btn sm" data-act="os" data-date="${S.date}">${IC.clip}Ordem do dia</button>` : ''}${podeCriarEv() ? `<button class="btn gold sm" data-act="novoev" data-date="${S.date}">${IC.plus}Nova</button>` : ''}</div></div>
  ${evs.length ? `<div class="houses">${evs.map((e) => houseCard(e, 'hoje')).join('')}</div>` : `<div class="panel empty"><b>Nenhuma operação nesta data</b>${podeCriarEv() ? 'Crie uma operação para montar os turnos e a escala.' : 'Quando você for responsável por um turno, ele aparece aqui.'}</div>`}`;
};

function mesGrid(mes, sel, act) {
  const [y, m] = mes.split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const byDay = {}; visEventos().forEach((e) => (byDay[e.data] ||= []).push(e));
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d); const n = (byDay[k] || []).length;
    cells += `<button class="${d.getMonth() !== m - 1 ? 'out' : ''} ${k === hoje() ? 'today' : ''} ${k === sel ? 'sel' : ''}" data-act="${act}" data-d="${k}" aria-label="${fmtDL(k)}${n ? `, ${n} operações` : ''}">${d.getDate()}<span class="dots">${'<i></i>'.repeat(Math.min(n, 5))}</span></button>`;
  }
  return `<div class="cal">${DIAS.map((d) => `<span class="dw">${d}</span>`).join('')}${cells}</div>`;
}
VIEWS.agenda = () => {
  if (!S.calSel) S.calSel = hoje();
  const [y, m] = S.calMes.split('-').map(Number);
  const sel = visEventos().filter((e) => e.data === S.calSel).sort((a, b) => toMin(a.inicio) - toMin(b.inicio));
  return `
  <div class="panel">
    <div class="row" style="margin-bottom:12px"><button class="icon" data-act="mes" data-n="-1" aria-label="Mês anterior">${IC.back}</button><span class="grow disp" style="text-align:center;font-size:16px">${MESES[m - 1]} ${y}</span><button class="icon" data-act="mes" data-n="1" aria-label="Próximo mês">${IC.next}</button></div>
    ${mesGrid(S.calMes, S.calSel, 'calday')}
  </div>
  <div class="sechead"><span class="h2">${fmtD(S.calSel)} · ${sel.length} operação(ões)</span><div class="row" style="gap:8px">${sel.length ? `<button class="btn sm" data-act="os" data-date="${S.calSel}">${IC.clip}Ordem</button>` : ''}${podeCriarEv() ? `<button class="btn gold sm" data-act="novoev" data-date="${S.calSel}">${IC.plus}Nova</button>` : ''}</div></div>
  ${sel.length ? `<div class="houses">${sel.map((e) => houseCard(e, 'agenda')).join('')}</div>` : '<div class="panel empty"><b>Dia livre</b>Nenhuma operação marcada.</div>'}`;
};

/* ---------- operação ---------- */
function turnoBloco(e, t, pode) {
  const es = escTurno(t.id).map((s) => ({ s, c: colab(s.colab_id) }));
  const cats = {}; es.forEach((x) => { const k = x.s.cat_id || 0; (cats[k] ||= { nome: catNome(x.s), curso: !!catg(x.s.cat_id).exige_curso, ord: catg(x.s.cat_id).valor || 0, itens: [] }).itens.push(x); });
  const groups = Object.values(cats).sort((a, b) => b.ord - a.ord);
  const ativos = es.filter((x) => x.s.status !== 'faltou').length, pv = prevTot(t);
  return `<div class="panel turno">
    <div class="row" style="align-items:flex-start;gap:10px"><div class="grow"><span class="eyebrow">${esc(t.nome)} · ${t.inicio}–${t.fim}</span>
      <div class="small mute" style="margin-top:4px">Responsável: ${t.responsavel_id ? `<b style="color:var(--ink)">${esc(user(t.responsavel_id).nome)}</b>` : '<b style="color:var(--bad)">a definir</b>'} · ${ativos} escalado(s)${pv ? ` de ${pv} previsto(s)` : ''}</div></div>
      ${pode ? `<button class="icon" data-act="editturno" data-id="${t.id}" aria-label="Editar ${esc(t.nome)}">${IC.edit}</button>` : ''}</div>
    ${pv ? `<div class="row wrap" style="gap:6px">${covChips(t)}</div>` : (pode ? `<button class="chip" data-act="editturno" data-id="${t.id}" style="align-self:flex-start">${ic('plus', 13)} Definir efetivo previsto</button>` : '')}
    ${groups.map((g) => `<div><div class="row" style="padding:8px 0 2px"><span class="eyebrow grow" style="color:var(--mute)">${esc(g.nome)}</span><span class="small mute num">${g.itens.length}${verValor() ? ' · ' + brl(g.itens.filter((x) => x.s.status !== 'faltou').reduce((a, x) => a + valS(x.s), 0)) : ''}</span></div>
      <div class="list">${g.itens.sort((a, b) => b.c.sexo.localeCompare(a.c.sexo) || a.c.nome.localeCompare(b.c.nome)).map((x) => `
        <div class="item ${pode ? 'tap' : ''} ${x.s.status === 'faltou' ? 'out' : ''}" ${pode ? `data-act="editesc" data-id="${x.s.id}" role="button" tabindex="0"` : ''}>
          ${av(x.c)}
          <div class="tx"><span class="n">${esc(x.c.nome)}</span><span class="s"><span class="tag ${x.c.sexo === 'F' ? 'f' : 'm'}">${x.c.sexo}</span><span>${x.s.ent_prev}–${x.s.sai_prev}</span>${g.curso ? cursoTag(x.c, e.data) : ''}${x.s.adicional ? `<span class="tag goldline">+${brl(x.s.adicional)} · ${esc(x.s.adicional_motivo)}</span>` : ''}${x.s.obs ? `<span>${esc(x.s.obs)}</span>` : ''}${x.s.status === 'faltou' ? '<span class="tag bad">faltou</span>' : ''}</span></div>
          ${verValor() ? `<span class="val">${brl(valS(x.s))}</span>` : ''}
        </div>`).join('')}</div></div>`).join('') || `<div class="empty" style="padding:14px 8px">Ninguém escalado neste turno ainda.</div>`}
  </div>`;
}

  const selT = S.evTurno === 'todos' ? ts : ts.filter((t) => t.id === S.evTurno);

  const tbar = `<div class="chips tbar">${ts.length > 1 ? `<button class="chip ${S.evTurno === 'todos' ? 'on' : ''}" data-act="evturno" data-v="todos">Todos os turnos</button>` : ''}${ts.map((t) => `<button class="chip ${S.evTurno === t.id ? 'on' : ''}" data-act="evturno" data-v="${t.id}">${esc(t.nome)} · ${t.inicio}–${t.fim}${faltamTurno(t) ? ` <b style="color:${S.evTurno === t.id ? '#5A1C17' : 'var(--bad)'}">−${faltamTurno(t)}</b>` : ''}</button>`).join('')}${pode ? `<button class="chip add" data-act="proxturno" data-id="${e.id}">${ic('plus', 14)}Próximo turno</button>` : ''}</div>`;

  } else if (S.evTab === 'presenca') {

/* ---------- relatórios ---------- */
function relDefault() { return { ...finDefault(), casa: '', sup: '', cat: '', aba: 'geral' }; }
function relFiltra(R, de, ate) {
  const sup = Number(R.sup), cs = Number(R.casa), ct = Number(R.cat);

    .filter((x) => x.e && x.e.data >= de && x.e.data <= ate && (!cs || x.e.casa_id === cs) && (!ct || x.s.cat_id === ct)
      && (!sup || x.e.supervisor_id === sup || (x.e.supervisores || []).includes(sup) || (x.t && x.t.responsavel_id === sup)))
    .sort((a, b) => a.e.data.localeCompare(b.e.data) || casa(a.e.casa_id).nome.localeCompare(casa(b.e.casa_id).nome) || a.c.nome.localeCompare(b.c.nome));

const relLinhas = () => relFiltra(S.rel, S.rel.de, S.rel.ate);

function cobRange(R, de, ate) {

  DB.eventos.filter((ev) => ev.data >= de && ev.data <= ate && (!cs || ev.casa_id === cs) && (!sup || ev.supervisor_id === sup || (ev.supervisores || []).includes(sup))).forEach((ev) => turnosOf(ev.id).forEach((t) => cobertura(t).forEach((r) => { if (!r.prev || (ct && r.k !== ct)) return; p += r.prev; e += Math.min(r.esc, r.prev); })));

function delta(a, b, unid, bomBaixo) {

}
function agrupa(L, keyFn, nomeFn) {
  const m = {};
  L.forEach((x) => { const k = keyFn(x); const g = (m[k] ||= { nome: nomeFn(x), ops: new Set(), esc: 0, pres: 0, falt: 0, atr: 0, v: 0 }); g.ops.add(x.e.id); if (x.s.status === 'faltou') g.falt++; else { g.esc++; g.v += valS(x.s); } if (x.s.status === 'presente' || x.s.status === 'concluido') g.pres++; if (atrasoMin(x.s)) g.atr++; });

function tabelaGrupo(titulo, rows) {
  if (!rows.length) return '';
  return `<div class="panel"><span class="h2">${titulo}</span><div class="scroll-x"><table class="tbl" style="margin-top:6px"><thead><tr><th>${titulo.replace('Por ', '')}</th><th class="r">Ops</th><th class="r">Diárias</th><th class="r">Faltas</th><th class="r">Atrasos</th><th class="r">Presença</th>${verValor() ? '<th class="r">Valor</th>' : ''}</tr></thead><tbody>${rows.map((g) => { const tx = g.pres + g.falt ? Math.round((g.pres / (g.pres + g.falt)) * 100) : null; return `<tr><td>${esc(g.nome)}</td><td class="r">${g.ops.size}</td><td class="r">${g.esc}</td><td class="r" style="${g.falt ? 'color:var(--bad);font-weight:700' : ''}">${g.falt}</td><td class="r">${g.atr}</td><td class="r">${tx == null ? '—' : tx + '%'}</td>${verValor() ? `<td class="r">${brl(g.v)}</td>` : ''}</tr>`; }).join('')}</tbody></table></div></div>`;
}
VIEWS.relatorios = () => {
  if (!S.rel) S.rel = relDefault();
  const R = S.rel, L = relLinhas(), M = metr(L);
  const len = diasAte(R.de, R.ate) + 1, pde = addD(R.de, -len), pate = addD(R.de, -1);
  const temAnt = DB.de && DB.de <= pde;
  const PL = temAnt ? relFiltra(R, pde, pate) : [];
  const P = PL.length ? metr(PL) : null;
  const cob = cobRange(R, R.de, R.ate), cobP = P ? cobRange(R, pde, pate) : null;
  const abas = [['geral', 'Visão geral'], ['faltas', `Faltas${M.falt ? ` (${M.falt})` : ''}`]].concat(isFin() ? [['pag', 'Pagamentos']] : [], [['pessoas', 'Pessoas']]);
  if (!abas.some((a) => a[0] === R.aba)) R.aba = 'geral';
  let corpo = '';
  if (R.aba === 'geral') {
    corpo = tabelaGrupo('Por casa', agrupa(L, (x) => x.e.casa_id, (x) => casa(x.e.casa_id).nome))
      + tabelaGrupo('Por supervisor', agrupa(L, (x) => x.e.supervisor_id, (x) => user(x.e.supervisor_id).nome))
      + tabelaGrupo('Por responsável de turno', agrupa(L.filter((x) => x.t && x.t.responsavel_id), (x) => x.t.responsavel_id, (x) => user(x.t.responsavel_id).nome))
      + tabelaGrupo('Por categoria', agrupa(L, (x) => x.s.cat_id, (x) => catNome(x.s)))
      || '<div class="panel empty"><b>Nada no período</b>Ajuste as datas ou os filtros.</div>';
  } else if (R.aba === 'faltas') {
    const F = L.filter((x) => x.s.status === 'faltou'), A = L.filter((x) => atrasoMin(x.s));
    const reinc = {}; F.forEach((x) => { (reinc[x.c.id] ||= { c: x.c, n: 0 }).n++; });
    const rl = Object.values(reinc).filter((r) => r.n >= 2).sort((a, b) => b.n - a.n);
    const porDia = {}; F.forEach((x) => (porDia[x.e.data] ||= []).push(x));
    corpo = `${rl.length ? `<div class="panel" style="border-color:#5A2A26"><span class="h2" style="color:var(--bad)">Reincidência no período</span><div class="list" style="margin-top:4px">${rl.map((r) => `<div class="item tap" data-act="opencol" data-id="${r.c.id}" role="button" tabindex="0">${av(r.c)}<div class="tx"><span class="n">${esc(r.c.nome)}</span><span class="s">${esc(catg(r.c.cat_id).nome)}</span></div><span class="tag bad">${r.n} faltas</span></div>`).join('')}</div></div>` : ''}
    <div class="panel flush"><div class="row" style="padding:14px 0 4px"><span class="h2 grow">Quem faltou</span><span class="small mute">${F.length}</span></div>
      ${Object.keys(porDia).map((d) => `<div class="eyebrow" style="padding-top:8px;color:var(--mute)">${fmtD(d)}</div><div class="list">${porDia[d].map((x) => `<div class="item tap" data-act="openev" data-id="${x.e.id}" data-from="relatorios" data-tab="presenca" data-turno="${x.s.turno_id}" role="button" tabindex="0">${av(x.c)}<div class="tx"><span class="n">${esc(x.c.nome)}</span><span class="s"><span>${esc(casa(x.e.casa_id).nome)}</span><span>${esc(x.t ? x.t.nome : '')} ${x.t ? x.t.inicio : ''}</span><span>${esc(catSigla(x.s))}</span><span>Sup. ${esc(user(x.e.supervisor_id).nome)}</span></span></div><span class="tag bad">Faltou</span></div>`).join('')}</div>`).join('') || '<div class="empty"><b>Nenhuma falta no período</b>Essa ferida está fechada.</div>'}</div>
    <div class="panel flush"><div class="row" style="padding:14px 0 4px"><span class="h2 grow">Atrasos</span><span class="small mute">${A.length}</span></div><div class="list">${A.map((x) => `<div class="item">${av(x.c)}<div class="tx"><span class="n">${esc(x.c.nome)}</span><span class="s"><span>${fmtD(x.e.data)}</span><span>${esc(casa(x.e.casa_id).nome)}</span><span>previsto ${x.s.ent_prev} · chegou ${x.s.entrada}</span></span></div><span class="tag bad">+${fmtM(atrasoMin(x.s))}</span></div>`).join('') || '<div class="empty">Nenhum atraso registrado.</div>'}</div></div>`;
  } else if (R.aba === 'pag') {
    const pessoas = {}; M.val.forEach((x) => { const p = (pessoas[x.c.id] ||= { c: x.c, n: 0, v: 0, pago: 0 }); p.n++; p.v += valS(x.s); if (x.s.pago) p.pago += valS(x.s); });
    const pl = Object.values(pessoas).sort((a, b) => (b.v - b.pago) - (a.v - a.pago) || a.c.nome.localeCompare(b.c.nome));
    corpo = `<div class="small mute">Pago ${brl(M.pago)} · Pendente <b style="color:var(--ink)">${brl(M.total - M.pago)}</b></div>
    ${M.total - M.pago > 0 ? '<button class="btn gold" data-act="pagartudo">Marcar tudo do período como pago</button>' : ''}
    <div class="panel flush"><div class="list">${pl.map((p) => `<div class="item">${av(p.c)}<div class="tx"><span class="n">${esc(p.c.nome)}</span><span class="s"><span>${p.n} diária(s)</span>${p.v - p.pago > 0 ? `<span>pendente ${brl(p.v - p.pago)}</span><button class="chip on" style="padding:3px 12px;font-size:12px" data-act="pagarp" data-id="${p.c.id}" data-de="${R.de}" data-ate="${R.ate}">Pagar</button>` : '<span class="tag ok">pago</span>'}</span></div><span class="val">${brl(p.v)}</span><button class="icon" data-act="extrato" data-id="${p.c.id}" data-de="${R.de}" data-ate="${R.ate}" aria-label="Extrato de ${esc(p.c.nome)}">${IC.doc}</button></div>`).join('') || '<div class="empty"><b>Nada no período</b></div>'}</div></div>`;
  } else {
    const pp = {}; L.forEach((x) => { const p = (pp[x.c.id] ||= { c: x.c, n: 0, f: 0, a: 0, v: 0 }); if (x.s.status === 'faltou') p.f++; else { p.n++; p.v += valS(x.s); } if (atrasoMin(x.s)) p.a++; });
    const pl = Object.values(pp).sort((a, b) => b.f - a.f || b.a - a.a || b.n - a.n);
    corpo = `<div class="panel flush"><div class="list">${pl.map((p) => `<div class="item tap" data-act="opencol" data-id="${p.c.id}" role="button" tabindex="0">${av(p.c)}<div class="tx"><span class="n">${esc(p.c.nome)}</span><span class="s"><span>${p.n} diária(s)</span>${p.f ? `<span class="tag bad">${p.f} falta(s)</span>` : ''}${p.a ? `<span class="tag warn">${p.a} atraso(s)</span>` : ''}</span></div>${verValor() ? `<span class="val">${brl(p.v)}</span>` : ''}</div>`).join('') || '<div class="empty"><b>Nada no período</b></div>'}</div></div>`;
  }
  return `
  <div class="panel form">
    <div class="chips">${[['hoje', 'Hoje'], ['semana', 'Esta semana'], ['passada', 'Semana passada'], ['mes', 'Este mês'], ['mesp', 'Mês passado']].map(([k, l]) => `<button class="chip ${R.preset === k ? 'on' : ''}" data-act="relp" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="g2"><label class="f">De<input class="inp" type="date" id="rde" value="${R.de}"></label><label class="f">Até<input class="inp" type="date" id="rate" value="${R.ate}"></label></div>
    <div class="g2">
      <label class="f">Casa<select class="inp" id="rcasa"><option value="">Todas</option>${DB.casas.map((c) => `<option value="${c.id}" ${String(c.id) === R.casa ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></label>
      <label class="f">Categoria<select class="inp" id="rcat"><option value="">Todas</option>${DB.categorias.map((c) => `<option value="${c.id}" ${String(c.id) === R.cat ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></label>
    </div>
    ${isGeral() || isFin() ? `<label class="f">Supervisor ou responsável<select class="inp" id="rsup"><option value="">Todos</option>${equipeInterna().map((u) => `<option value="${u.id}" ${String(u.id) === R.sup ? 'selected' : ''}>${esc(u.nome)} · ${esc(nivNome(u.papel))}</option>`).join('')}</select></label>` : ''}
    <button class="btn" data-act="relgo">Aplicar filtros</button>
  </div>
  <div class="panel termo"><div class="row" style="margin-bottom:10px"><span class="eyebrow grow">Termômetro do período</span><span class="small mute">${fmtDL(R.de)} a ${fmtDL(R.ate)}</span></div>
    <div class="kpis">
      <div class="kpi"><span class="l">Presença</span><span class="v">${M.tx == null ? '—' : M.tx + '%'}</span>${delta(M.tx, P && P.tx, ' p.p.', false)}</div>
      <div class="kpi"><span class="l">Faltas</span><span class="v" style="${M.falt ? 'color:var(--bad)' : ''}">${M.falt}</span>${delta(M.falt, P && P.falt, '', true)}</div>
      <div class="kpi"><span class="l">Atrasos</span><span class="v">${M.atr}</span>${delta(M.atr, P && P.atr, '', true)}</div>
      <div class="kpi"><span class="l">Efetivo preenchido</span><span class="v">${cob == null ? '—' : cob + '%'}</span>${delta(cob, cobP, ' p.p.', false)}</div>
    </div>
    <div class="row wrap small mute" style="gap:6px 16px;margin-top:10px"><span><b style="color:var(--ink)">${M.n}</b> diárias</span><span><b style="color:var(--ink)">${new Set(M.val.map((x) => x.c.id)).size}</b> pessoas</span>${verValor() ? `<span>Total <b class="gold">${brl(M.total)}</b></span>` : ''}</div>
  </div>
  <div class="seg four" role="tablist">${abas.map(([k, l]) => `<button role="tab" aria-selected="${R.aba === k}" class="${R.aba === k ? 'on' : ''}" data-act="relaba" data-v="${k}">${l}</button>`).join('')}</div>
  ${corpo}
  <div class="row wrap"><button class="btn grow" data-act="csvrel" ${L.length ? '' : 'disabled'}>${IC.dl}Baixar planilha</button><button class="btn gold grow" data-act="relpdf" ${L.length ? '' : 'disabled'}>${IC.doc}Relatório em PDF</button></div>`;
};

/* ================= folhas ================= */
function sheetCal() {
  const st = { mes: S.date.slice(0, 7) };
  openSheet('Escolher data', '<div id="calbox"></div>', '<button class="btn grow" data-act="hojecal">Ir para hoje</button>', { kind: 'cal', st });
  const draw = () => {
    const [y, m] = st.mes.split('-').map(Number);
    $('#calbox').innerHTML = `<div class="row" style="margin-bottom:12px"><button class="icon" id="cmp" aria-label="Mês anterior">${IC.back}</button><span class="grow disp" style="text-align:center;font-size:16px">${MESES[m - 1]} ${y}</span><button class="icon" id="cmn" aria-label="Próximo mês">${IC.next}</button></div>${mesGrid(st.mes, S.date, 'calpickd')}`;
    const mv = (n) => { const d = new Date(y, m - 1 + n, 1); st.mes = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; ensureRange(addD(st.mes + '-01', -7), addD(st.mes + '-28', 14)).then(draw, draw); };
    $('#cmp').onclick = () => mv(-1); $('#cmn').onclick = () => mv(1);
  };
  draw();
}

function prevGrid(previsto) {
  const cats = DB.categorias.filter((k) => k.ativo);
  if (!cats.length) return '<div class="small mute">Cadastre as categorias em Mais › Categorias para definir o efetivo previsto.</div>';
  return `<div class="pgrid">${cats.map((k) => `<label class="pg"><span>${esc(k.sigla)}</span><small>${esc(k.nome)}</small><input class="inp" type="number" inputmode="numeric" min="0" max="999" data-k="${k.id}" value="${(previsto || {})[k.id] || ''}" placeholder="0" aria-label="Quantidade prevista de ${esc(k.nome)}"></label>`).join('')}</div>`;
}
const lerPrev = () => { const o = {}; $$('#sb [data-k]').forEach((i) => { const n = parseInt(i.value, 10); if (n > 0) o[i.dataset.k] = n; }); return o; };
const optUsers = (lista, sel, vazio) => `${vazio ? `<option value="">${esc(vazio)}</option>` : ''}${lista.map((u) => `<option value="${u.id}" ${u.id === sel ? 'selected' : ''}>${esc(u.nome)} · ${esc(nivNome(u.papel))}</option>`).join('')}`;

function sheetEvento(e, dateDefault) {
  const casasAt = DB.casas.filter((c) => c.ativo || (e && c.id === e.casa_id));
  if (!casasAt.length) return toast(isGeral() ? 'Cadastre uma casa primeiro em Mais › Casas e locais.' : 'A gerência ainda não cadastrou as casas.', true);
  const lid = lideres();

function cobW(t) {

  const ks = new Set([...Object.keys(t.previsto || {}).map(Number), ...Object.keys(conta).map(Number)]);
  return [...ks].map((k) => ({ k, prev: (t.previsto || {})[k] || 0, esc: conta[k] || 0 })).sort((a, b) => b.prev - a.prev || a.k - b.k);

    if (!/^\d{4}-\d{2}-\d{2}$/.test(WZ.data || '')) return toast('Informe a data da operação.', true);
    el.disabled = true;

    if (!WZ || !sheetCtx || sheetCtx.kind !== 'wz') return;

  if (WZ.passo === 1) {
    const sem = WZ.turnos.findIndex((t) => !t.inicio || !t.fim);

function lerFoto(input, onUrl, max = 480, q = 0.72) {
  input.onchange = (ev) => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        onUrl(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = () => toast('Não consegui ler essa foto. Tente de novo.', true);
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
}

    const n = Number(b.dataset.add); if (!n) { ['d', 'm', 'y'].forEach((p) => set(p, '')); return; }

const docBand = (titulo, sub) => `<div class="pband">${EMBLEM(40)}<div class="grow"><b>FAV Segurança</b><span>Força e Ação Valente Segurança Ltda</span></div><div class="pr"><b>${esc(titulo)}</b><span>${esc(sub)}</span></div></div>`;
function extratoData(cid, de, ate) {
  const c = colab(cid);
  const itens = finLinhas(de, ate, cid).sort((a, b) => a.e.data.localeCompare(b.e.data));
  const total = itens.reduce((a, x) => a + valS(x.s), 0), pago = itens.filter((x) => x.s.pago).reduce((a, x) => a + valS(x.s), 0);
  const adic = itens.reduce((a, x) => a + (x.s.adicional || 0), 0);
  const ult = itens.length ? itens[itens.length - 1].e.data : null;
  return { c, itens, total, pago, adic, pend: total - pago, prev: ult ? nextThu(ult) : null, de, ate };
}

function carregaScript(src, global) {
  if (window[global]) return Promise.resolve();
  return new Promise((ok, nao) => { const s = document.createElement('script'); s.src = src; s.onload = () => (window[global] ? ok() : nao()); s.onerror = nao; document.head.appendChild(s); });
}
async function baixarImagem(html, nome, largura = 760) {
  toast('Gerando imagem…');
  try { await carregaScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'html2canvas'); }
  catch (e) { return toast('Não consegui carregar o gerador de imagem. Confira a internet ou use o PDF.', true); }
  const box = document.createElement('div');
  box.style.cssText = `position:fixed;left:-12000px;top:0;width:${largura}px;pointer-events:none`;
  box.innerHTML = html; document.body.appendChild(box);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const cv = await window.html2canvas(box.firstElementChild, { backgroundColor: null, scale: 2, useCORS: true, logging: false });
    const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
    const file = new File([blob], nome, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: nome }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Imagem baixada');
  } catch (e) { toast('Não consegui gerar a imagem. Use o PDF.', true); }
  finally { box.remove(); }
}

function periodo(v) {
  const t = hoje(), wd = dt(t).getDay(), seg = addD(t, -((wd + 6) % 7));
  if (v === 'hoje') return [t, t];
  if (v === 'semana') return [seg, addD(seg, 6)];
  if (v === 'passada') return [addD(seg, -7), addD(seg, -1)];
  if (v === 'mesp') { const d = new Date(Number(t.slice(0, 4)), Number(t.slice(5, 7)) - 2, 1); return [iso(d), iso(new Date(d.getFullYear(), d.getMonth() + 1, 0))]; }
  return [t.slice(0, 8) + '01', iso(new Date(Number(t.slice(0, 4)), Number(t.slice(5, 7)), 0))];
}

  sair: async () => { try { await api('logout'); } catch (e) { /* ignora */ } S.user = null; stopPoll(); FOTOS.clear(); viewLogin(); },
  trocasenha: async () => { const r = await run(() => api('conta.senha', { atual: $('#satual').value, nova: $('#snova').value }), 'Senha alterada'); if (r) { $('#satual').value = ''; $('#snova').value = ''; } },
  cfgval: (d, el) => run(() => api('cfg.set', { supValores: el.checked }), el.checked ? 'Supervisores podem editar valores' : 'Só RH/financeiro e diretoria editam valores'),
  editcat: (d) => sheetCat(Number(d.id) ? catg(Number(d.id)) : null),
  savecat: async () => { const k = sheetCtx.k; const v = { id: k ? k.id : undefined, nome: $('#knome').value, sigla: $('#ksigla').value, valor: parseMoney($('#kval').value), exige_curso: $('#kcurso').checked, descricao: $('#kdesc').value, ativo: $('#kativo').checked }; if (await run(() => api('categoria.save', v), 'Categoria salva')) { closeSheet(); render(); } },
  editcasa: (d) => sheetCasa(Number(d.id) ? casa(Number(d.id)) : null),
  savecasa: async () => { const k = sheetCtx.k; const v = { id: k ? k.id : undefined, nome: $('#hnome').value, endereco: $('#hend').value, ativo: $('#hativo').checked }; if (await run(() => api('casa.save', v), 'Casa salva')) { closeSheet(); render(); } },
  edituser: (d) => sheetUser(Number(d.id) ? user(Number(d.id)) : null),
  saveuser: async () => {
    const u = sheetCtx.u; const pr = $('input[name=upapel]:checked');
    const v = { id: u ? u.id : undefined, nome: $('#unome').value, email: $('#umail').value, senha: $('#usenha') ? $('#usenha').value : '', papel: pr ? pr.value : 'supervisor', ativo: $('#uativo').checked };
    const r = await run(() => api('usuario.save', v), (x) => (u ? 'Acesso atualizado' : x && x.confirmar ? 'Acesso criado. A pessoa precisa confirmar pelo e-mail antes de entrar.' : 'Acesso criado. Envie o e-mail e a senha para a pessoa.'));
    if (r) { closeSheet(); render(); }
  },
};
function copiar(text, ok) {
  const fb = () => { const ta = document.createElement('textarea'); ta.value = text; ta.className = 'inp'; ta.style.minHeight = '160px'; const sb = $('#sb'); if (sb) { sb.appendChild(ta); ta.focus(); ta.select(); try { document.execCommand('copy'); toast(ok); } catch (e) { toast('Selecione o texto e copie pelo menu do celular.'); } } };
  try { navigator.clipboard.writeText(text).then(() => toast(ok), fb); } catch (e) { fb(); }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return;
  const f = A[el.dataset.act]; if (!f) return;
  if (el.dataset.act === 'sheetbg') return f(el.dataset, el, e);
  e.preventDefault(); f(el.dataset, el, e);
});
document.addEventListener('change', (e) => { const el = e.target; if (el.matches && el.matches('input[type=checkbox][data-act]')) A[el.dataset.act](el.dataset, el, e); });
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('input', (e) => { if (e.target.id === 'eqbusca') { S.eqBusca = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#eqbusca'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) { /* ignora */ } } } });

boot();

</script>
